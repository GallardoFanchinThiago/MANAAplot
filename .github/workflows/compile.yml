name: Compilar Ejecutables MANAAplot

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    name: Compilar en ${{ matrix.os }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v5

      # Linux: utilizar Python y Tcl/Tk de Ubuntu 22.04.
      - name: Instalar Python y Tcl/Tk en Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv python3-tk

          python3 --version
          ldd --version

          python3 -c "import tkinter; print('Tcl/Tk:', tkinter.Tcl().eval('info patchlevel'))"

          python3 -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      # Windows: utilizar Python 3.12.
      - name: Configurar Python 3.12 en Windows
        if: runner.os == 'Windows'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Mostrar versión de Python
        run: python --version

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy matplotlib pyinstaller

      - name: Verificar Tkinter
        run: |
          python -c "import tkinter; print('Tkinter disponible')"
          python -c "import tkinter; print('Tcl/Tk:', tkinter.Tcl().eval('info patchlevel'))"

      - name: Generar y parchear archivo spec
        shell: python
        run: |
          import subprocess

          subprocess.run([
              "pyi-makespec",
              "--noconsole",
              "--onefile",
              "--hidden-import",
              "PIL._tkinter_finder",
              "manaaplot.py"
          ], check=True)

          with open("manaaplot.spec", "r", encoding="utf-8") as f:
              lines = f.readlines()

          lines.insert(
              0,
              "import sys\nsys.setrecursionlimit(5000)\n"
          )

          with open("manaaplot.spec", "w", encoding="utf-8") as f:
              f.writelines(lines)

      - name: Compilar con PyInstaller
        run: python -m PyInstaller --clean manaaplot.spec

      # Empaquetar Linux para conservar los permisos de ejecución.
      - name: Empaquetar ejecutable Linux
        if: runner.os == 'Linux'
        run: tar -czf MANAAplot-Linux-x86_64.tar.gz -C dist manaaplot

      - name: Subir ejecutable Linux
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: MANAAplot-Linux-x86_64
          path: MANAAplot-Linux-x86_64.tar.gz
          if-no-files-found: error

      - name: Subir ejecutable Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: MANAAplot-Windows-x86_64
          path: dist/*.exe
          if-no-files-found: error
